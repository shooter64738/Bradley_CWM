<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Bradley Continuum Wave Mechanics — Empirical Verification Engine</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.js"></script>
    <script>
      const v = Date.now();
      stlite.mount(
        {
          requirements: ["matplotlib"],
          entrypoint: "app.py",
          files: {
            "app.py": {
              url: "app.py?v=" + v
            },
            "all_sparc_galaxies.txt": {
              url: "all_sparc_galaxies.txt"
            },
            "pantheon_compact.csv": {
              url: "pantheon_compact.csv"
            }
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
